[project]
name = "vietnam-textbook-notebooklm"
version = "0.1.0"
description = "Simple NotebookLM-style RAG learning system for Vietnamese textbooks."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.31",
  "PyMuPDF>=1.24"
]

[project.optional-dependencies]
eval = ["ragas", "datasets"]
rerank = ["sentence-transformers"]

[tool.setuptools.packages.find]
where = ["src"]
