<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotebookLM SGK</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #182230;
      background: #eef3f7;
      --panel: #ffffff;
      --line: #d7e0ea;
      --muted: #607084;
      --ink: #182230;
      --teal: #007a78;
      --teal-soft: #e5f5f2;
      --amber: #f4b24f;
      --coral: #d85f44;
      --blue: #375dfb;
      --shadow: 0 18px 42px rgba(24, 34, 48, .10);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg, #eef3f7); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .app {
      width: min(1540px, calc(100vw - 32px));
      min-height: calc(100vh - 32px);
      margin: 16px auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .topbar {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .brand h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: 0; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .metrics { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .metric {
      min-width: 92px;
      border: 1px solid #dce5ee;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 8px 10px;
      text-align: right;
    }
    .metric strong { display: block; font-size: 18px; line-height: 1; }
    .metric span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(430px, 540px) minmax(480px, 1fr);
      gap: 12px;
      align-items: stretch;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid #e8eef4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-head h2 { margin: 0; font-size: 16px; line-height: 1.2; letter-spacing: 0; }
    .panel-head .subtle { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 14px 16px; }

    .source-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .source-controls { display: grid; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e8eef4; }
    .lesson-list { overflow: auto; padding: 8px; min-height: 0; }
    .lesson-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      padding: 9px 10px;
      display: grid;
      gap: 4px;
    }
    .lesson-button:hover { background: #f4f7fa; border-color: #e2eaf1; }
    .lesson-button.active { background: var(--teal-soft); border-color: #a7d8d1; }
    .lesson-button strong { font-size: 13px; line-height: 1.25; }
    .lesson-button span { color: var(--muted); font-size: 12px; }

    label { display: block; margin: 0 0 6px; color: #1b2430; font-size: 12px; font-weight: 800; }
    textarea, select, input {
      width: 100%;
      border: 1px solid #cbd7e4;
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--ink);
      outline: none;
    }
    textarea:focus, select:focus, input:focus { border-color: #69b8b3; box-shadow: 0 0 0 3px rgba(0, 122, 120, .12); }
    textarea { min-height: 178px; padding: 12px; resize: vertical; line-height: 1.55; }
    select, input { height: 42px; padding: 0 11px; }

    .studio {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 12px;
      border-bottom: 1px solid #e8eef4;
      background: #fbfcfe;
    }
    .mode-tabs button {
      min-height: 42px;
      border: 1px solid #d8e2eb;
      border-radius: 8px;
      background: #fff;
      color: #435166;
      font-weight: 800;
    }
    .mode-tabs button.active {
      color: #fff;
      background: var(--teal);
      border-color: var(--teal);
    }

    .studio-body { padding: 16px; display: grid; align-content: start; gap: 14px; overflow: auto; }
    .task-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .task-title h2 { margin: 0; font-size: 20px; line-height: 1.2; }
    .scope-pill {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 999px;
      background: #eef3ff;
      color: #304fcf;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .quick-grid { display: flex; flex-wrap: wrap; gap: 7px; }
    .quick {
      border: 1px solid #d8e2eb;
      border-radius: 999px;
      background: #fff;
      color: #42516a;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .quick:hover { border-color: #84c6c0; color: var(--teal); }

    .control-grid { display: grid; grid-template-columns: minmax(0, 1fr) 106px; gap: 10px; align-items: end; }
    .provider-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .primary {
      width: 100%;
      min-height: 46px;
      border: 1px solid #111c2c;
      border-radius: 8px;
      background: #111c2c;
      color: #fff;
      font-weight: 850;
      box-shadow: 0 12px 22px rgba(17, 28, 44, .16);
    }
    .primary:hover { background: #0b1524; }

    .status-line {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .status-line.error { color: #b42318; font-weight: 750; }

    .result-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .result-body {
      overflow: auto;
      padding: 16px;
      display: grid;
      align-content: start;
      gap: 14px;
    }
    .empty-state {
      min-height: 210px;
      border: 1px dashed #cbd7e4;
      border-radius: 8px;
      background: #fbfcfe;
      display: grid;
      align-content: center;
      gap: 8px;
      padding: 24px;
      color: #42516a;
    }
    .empty-state strong { color: var(--ink); font-size: 18px; }

    .answer-card, .source-card, .quiz-card, .flashcard, .summary-card {
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }
    .answer-text { line-height: 1.65; font-size: 15px; }
    .markdown-body p { margin: 0 0 10px; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul, .markdown-body ol { margin: 8px 0 10px 22px; padding: 0; }
    .markdown-body li { margin: 4px 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      margin: 12px 0 8px;
      line-height: 1.25;
      letter-spacing: 0;
      color: var(--ink);
      font-weight: 850;
    }
    .markdown-body h1 { font-size: 20px; }
    .markdown-body h2 { font-size: 18px; }
    .markdown-body h3 { font-size: 16px; }
    .markdown-body h4 { font-size: 15px; }
    .markdown-body h5, .markdown-body h6 { font-size: 14px; }
    .markdown-body code {
      border: 1px solid #dbe4ee;
      border-radius: 6px;
      background: #f5f8fb;
      padding: 1px 5px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .92em;
    }
    .markdown-body pre {
      overflow: auto;
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      background: #f5f8fb;
      padding: 12px;
    }
    .markdown-body pre code { border: 0; padding: 0; background: transparent; }
    .markdown-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 14px;
    }
    .markdown-table th, .markdown-table td { border: 1px solid #dbe4ee; padding: 7px 9px; text-align: left; vertical-align: top; }
    .markdown-table th { background: #f5f8fb; }
    .cite-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      margin-left: 4px;
      padding: 1px 7px;
      border: 1px solid #bfd1e5;
      border-radius: 999px;
      background: #f7fbff;
      color: #31506f;
      font-size: 12px;
      font-weight: 800;
      vertical-align: baseline;
      white-space: nowrap;
    }
    .reference-list {
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .reference-list h3 { margin: 0; font-size: 14px; }
    .reference-item {
      border: 1px solid #e2eaf1;
      border-radius: 8px;
      background: #fff;
      padding: 9px 10px;
    }
    .reference-item summary { cursor: pointer; font-weight: 850; }
    .reference-item p { margin: 7px 0 0; color: #42516a; font-size: 13px; line-height: 1.5; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: #edf7f4;
      color: var(--teal);
      font-size: 12px;
      font-weight: 850;
    }
    .badge.warn { background: #fff4e2; color: #9a5a00; }
    .badge.coral { background: #fff0ec; color: #b3432b; }

    .quiz-card { display: grid; gap: 10px; }
    .quiz-card h3 { margin: 0; font-size: 15px; line-height: 1.45; }
    .options { display: grid; gap: 7px; }
    .option {
      border: 1px solid #d9e3ed;
      border-radius: 8px;
      background: #fbfcfe;
      color: #1d2939;
      padding: 10px 11px;
      text-align: left;
      line-height: 1.45;
    }
    .option.correct { border-color: #5fb59d; background: #e9f7f2; color: #065f46; }
    .option.wrong { border-color: #e58b7c; background: #fff0ec; color: #9f2f20; }
    .explain { display: none; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .quiz-card.answered .explain { display: block; }

    .quiz-evidence {
      border: 1px solid #e1e9f1;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 10px;
      display: none;
      gap: 9px;
    }
    .quiz-card.answered .quiz-evidence { display: grid; }
    .quiz-media {
      border: 1px solid #e1e9f1;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 10px;
      display: grid;
      gap: 9px;
    }
    .quiz-evidence-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #344256;
      font-size: 12px;
      font-weight: 850;
    }
    .quiz-evidence-pages { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
    .source-chip {
      border-radius: 999px;
      border: 1px solid #d4e1ed;
      background: #fff;
      padding: 3px 7px;
      color: #53657a;
      font-size: 11px;
      white-space: nowrap;
    }
    .evidence-title {
      color: #263241;
      font-size: 13px;
      font-weight: 850;
      margin-bottom: 8px;
    }
    .evidence-text {
      color: #4b5a70;
      font-size: 14px;
      line-height: 1.65;
    }
    .evidence-text .markdown-body {
      color: inherit;
      font-size: inherit;
      line-height: inherit;
    }
    .evidence-text .markdown-body p {
      margin: 0 0 8px;
    }
    .evidence-text .markdown-body ul,
    .evidence-text .markdown-body ol {
      margin: 7px 0 9px 20px;
      padding: 0;
    }
    .evidence-text .markdown-body li {
      margin: 4px 0;
    }
    .quiz-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 8px;
    }
    .quiz-image {
      min-width: 0;
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      text-decoration: none;
      text-align: left;
      padding: 0;
      color: inherit;
      cursor: zoom-in;
    }
    .quiz-image img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eef3f7;
    }
    .quiz-image span {
      display: block;
      padding: 6px 7px;
      color: #53657a;
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
    }

    .summary-visuals,
    .study-visuals {
      border: 1px solid #e1e9f1;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 10px;
      display: grid;
      gap: 9px;
    }
    .summary-visuals h3,
    .study-visuals h3 {
      margin: 0;
      color: #344256;
      font-size: 13px;
      line-height: 1.35;
    }
    .summary-visuals .quiz-images,
    .study-visuals .quiz-images {
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    }
    .summary-visuals .quiz-image img,
    .study-visuals .quiz-image img {
      aspect-ratio: 16 / 9;
      max-height: 180px;
      object-fit: contain;
    }

    .study-deck {
      display: grid;
      gap: 12px;
    }
    .study-deck-head,
    .study-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .study-progress {
      font-weight: 850;
      color: #263241;
    }
    .study-stage {
      position: relative;
      min-height: min(62vh, 520px);
      perspective: 1400px;
    }
    .study-card {
      position: absolute;
      inset: 0;
      display: none;
      cursor: pointer;
      outline: none;
    }
    .study-card.active { display: block; }
    .study-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      transition: transform .22s ease;
      transform-style: preserve-3d;
    }
    .study-card.flipped .study-card-inner { transform: rotateY(180deg); }
    .study-face {
      position: absolute;
      inset: 0;
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      background: #fff;
      padding: clamp(18px, 3vw, 30px);
      display: grid;
      align-content: center;
      gap: 16px;
      backface-visibility: hidden;
      overflow: auto;
      box-shadow: 0 18px 45px rgba(16, 24, 40, .08);
    }
    .study-back { transform: rotateY(180deg); align-content: start; }
    .study-kicker {
      display: inline-flex;
      width: fit-content;
      border: 1px solid #d8e6ef;
      border-radius: 999px;
      background: #f5f8fb;
      color: #53657a;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 850;
    }
    .study-front-text {
      color: var(--ink);
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.25;
      font-weight: 850;
      text-align: center;
    }
    .study-back-text {
      color: #263241;
      font-size: 16px;
      line-height: 1.65;
    }
    .study-hint {
      border-left: 3px solid #8fcac4;
      background: #f0faf7;
      padding: 8px 10px;
      color: #31506f;
      font-size: 13px;
      line-height: 1.45;
    }
    .study-evidence {
      color: #53657a;
      font-size: 13px;
      line-height: 1.55;
    }
    .study-action {
      justify-self: center;
      color: var(--muted);
      font-size: 13px;
    }
    .study-controls button {
      border: 1px solid #d7e3ee;
      border-radius: 8px;
      background: #fff;
      color: #263241;
      padding: 9px 13px;
      font-weight: 850;
      cursor: pointer;
    }
    .study-controls button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .source-card { display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 12px; }
    .source-card strong { display: block; margin-bottom: 6px; font-size: 13px; line-height: 1.35; }
    .source-card p { margin: 0; color: #4b5a70; font-size: 13px; line-height: 1.5; }
    .thumbs { display: grid; grid-template-columns: repeat(2, 50px); gap: 6px; align-content: start; }
    .thumbs button {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 7px;
      padding: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 7px; border: 1px solid #dbe4ee; background: #eef3f7; }

    .image-modal[hidden] { display: none; }
    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .image-modal-backdrop {
      position: absolute;
      inset: 0;
      border: 0;
      background: rgba(15, 23, 42, .72);
      cursor: zoom-out;
    }
    .image-modal-box {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100vw - 48px));
      max-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #dbe4ee;
      padding: 12px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, .28);
    }
    .image-modal-box img {
      width: 100%;
      max-height: calc(100vh - 150px);
      object-fit: contain;
      background: #f6f8fb;
      border-radius: 6px;
    }
    .image-modal-box p {
      margin: 0;
      color: #344256;
      font-size: 13px;
      line-height: 1.45;
    }
    .image-modal-close {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.72);
      background: rgba(17, 28, 44, .86);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .error-box {
      border: 1px solid #f0a79b;
      border-radius: 8px;
      background: #fff6f4;
      color: #a12b1c;
      padding: 14px;
      line-height: 1.55;
      font-weight: 750;
    }

    @media (max-width: 1180px) {
      .workspace { grid-template-columns: 280px minmax(0, 1fr); }
      .result-panel { grid-column: 1 / -1; min-height: 520px; }
    }
    @media (max-width: 760px) {
      .app { width: min(100vw - 18px, 1540px); margin: 9px auto; }
      .topbar { grid-template-columns: 1fr; }
      .metrics { justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .mode-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .control-grid { grid-template-columns: 1fr; }
      .source-card { grid-template-columns: 1fr; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
      svg: { fontCache: "global" }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>NotebookLM SGK Lịch sử và Địa lí 6</h1>
        <p id="globalStatus">Đang tải dữ liệu học tập...</p>
      </div>
      <div class="metrics">
        <div class="metric"><strong id="chunkCount">0</strong><span>chunks</span></div>
        <div class="metric"><strong id="pageCount">0</strong><span>trang</span></div>
        <div class="metric"><strong id="lessonCount">0</strong><span>bài</span></div>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel source-panel">
        <div class="panel-head">
          <h2>Nguồn SGK</h2>
          <span class="subtle" id="activeSubject">Tất cả</span>
        </div>
        <div class="source-controls">
          <div>
            <label for="subject">Môn học</label>
            <select id="subject"><option value="">Tất cả</option></select>
          </div>
          <div>
            <label for="lessonSearch">Lọc bài</label>
            <input id="lessonSearch" placeholder="Nhập tên bài hoặc số bài">
          </div>
        </div>
        <div class="lesson-list" id="lessonList"></div>
      </aside>

      <section class="panel studio">
        <div class="mode-tabs" role="tablist">
          <button class="active" data-task="ask">Hỏi đáp</button>
          <button data-task="summarize">Tóm tắt</button>
          <button data-task="quiz">Quiz</button>
          <button data-task="flashcards">Flashcards</button>
        </div>

        <div class="studio-body">
          <div class="task-title">
            <h2 id="taskTitle">Hỏi đáp theo SGK</h2>
            <span class="scope-pill" id="scopeLabel">Tất cả bài học</span>
          </div>

          <div class="quick-grid" id="quickGrid"></div>

          <div>
            <label for="query" id="queryLabel">Câu hỏi hoặc chủ đề</label>
            <textarea id="query"></textarea>
          </div>

          <div class="control-grid">
            <div id="providerWrap">
              <label for="provider">Model</label>
              <select id="provider"></select>
              <p class="provider-note" id="providerHint"></p>
            </div>
            <div id="countWrap">
              <label for="count">Số item</label>
              <input id="count" type="number" min="1" max="50" value="6">
            </div>
          </div>

          <button class="primary" id="run">Chạy hỏi đáp</button>
          <div class="status-line" id="runStatus"></div>
        </div>
      </section>

      <section class="panel result-panel">
        <div class="panel-head">
          <h2 id="resultTitle">Kết quả</h2>
          <span class="subtle" id="resultMeta">Sẵn sàng</span>
        </div>
        <div class="result-body" id="resultBody">
          <div class="empty-state">
            <strong>Chọn tác vụ, nhập câu hỏi hoặc chọn một bài học.</strong>
            <span>Quiz có thể chạy với ô nội dung trống nếu bạn đã chọn bài ở cột nguồn.</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="image-modal" id="imageModal" hidden>
    <button class="image-modal-backdrop" type="button" data-modal-close aria-label="Đóng ảnh"></button>
    <div class="image-modal-box" role="dialog" aria-modal="true" aria-label="Ảnh SGK">
      <button class="image-modal-close" type="button" data-modal-close aria-label="Đóng ảnh">×</button>
      <img id="imageModalImg" src="" alt="">
      <p id="imageModalCaption"></p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    const assetVersion = Date.now().toString(36);
    const assetUrl = (url) => {
      const value = String(url || "");
      if (!value || value.startsWith("data:")) return value;
      return `${value}${value.includes("?") ? "&" : "?"}v=${assetVersion}`;
    };
    const letters = ["A", "B", "C", "D"];

    let task = "ask";
    let docs = [];
    let lessons = [];
    let providerStatus = {};
    let selectedLessonId = "";
    const AUTO_TOP_K = { ask: 10, summarize: 10, quiz: 5, flashcards: 10 };
    const AUTO_QUERY = {
      summarize: "Tóm tắt ý chính và nội dung trọng tâm",
      quiz: "khái niệm, quy trình, số liệu và nội dung trọng tâm để ôn tập",
      flashcards: "thuật ngữ, khái niệm, định nghĩa, quy trình và công thức cần nhớ"
    };

    const taskConfig = {
      ask: {
        title: "Hỏi đáp theo SGK",
        label: "Câu hỏi",
        button: "Chạy hỏi đáp",
        placeholder: "Ví dụ: Kinh độ, vĩ độ là gì?",
        samples: ["Kinh độ, vĩ độ là gì?", "Vì sao cần học lịch sử?", "Hình 1.12 nói về tư liệu lịch sử gì?"]
      },
      summarize: {
        title: "Tóm tắt bài học",
        label: "Chủ đề cần tóm tắt",
        button: "Tạo tóm tắt",
        placeholder: "Để trống nếu muốn tóm tắt bài đang chọn.",
        samples: ["Tóm tắt ý chính", "Các khái niệm cần nhớ", "Nội dung trọng tâm để ôn tập"]
      },
      quiz: {
        title: "Tạo quiz ôn tập",
        label: "Chủ đề quiz",
        button: "Tạo quiz",
        placeholder: "Để trống để tạo quiz từ bài đang chọn, hoặc nhập chủ đề như: kinh độ, vĩ độ.",
        samples: ["Kinh độ, vĩ độ", "Lịch sử là gì?", "Nguồn gốc loài người"]
      },
      flashcards: {
        title: "Tạo flashcards",
        label: "Chủ đề flashcards",
        button: "Tạo flashcards",
        placeholder: "Để trống để tạo thẻ nhớ từ bài đang chọn.",
        samples: ["Khái niệm cần nhớ", "Sự kiện và thuật ngữ", "Địa lí Trái Đất"]
      }
    };

    function selectedLesson() {
      return lessons.find(lesson => lesson.lesson_id === selectedLessonId) || null;
    }

    function currentScopeText() {
      const lesson = selectedLesson();
      if (lesson) return `${lesson.subject_label || lesson.subject || "SGK"} · ${lesson.lesson_title}`;
      const subject = $("subject").value;
      return subject || "Tất cả bài học";
    }

    function filtersPayload() {
      const lesson = selectedLesson();
      if (lesson) return { lesson_id: lesson.lesson_id };
      const subject = $("subject").value;
      return subject ? { subject } : null;
    }

    function renderMetrics() {
      const doc = docs[0] || {};
      $("chunkCount").textContent = doc.chunks || 0;
      $("pageCount").textContent = (doc.pages || []).length;
      $("lessonCount").textContent = lessons.length;
    }

    function renderProviders(providers) {
      providerStatus = Object.fromEntries((providers || []).map(provider => [provider.value, provider]));
      $("provider").innerHTML = (providers || []).map(provider => {
        const label = `${provider.label}${provider.model ? " · " + provider.model : ""}${provider.available ? "" : " · chưa chạy"}`;
        return `<option value="${escapeHtml(provider.value)}" ${provider.available ? "" : "disabled"}>${escapeHtml(label)}</option>`;
      }).join("");
      const preferred = (providers || []).find(provider => provider.value === "openai_compatible" && provider.available)
        || (providers || []).find(provider => provider.value === "ollama" && provider.available)
        || (providers || []).find(provider => provider.value === "hf_local" && provider.available)
        || (providers || []).find(provider => provider.value === "extractive")
        || (providers || []).find(provider => provider.available);
      if (preferred) $("provider").value = preferred.value;
      updateProviderHint();
    }

    function updateProviderHint() {
      const info = providerStatus[$("provider").value];
      const extra = task === "quiz"
        ? " Với Quiz, model nhỏ có thể bị từ chối nếu không trả JSON/citation đủ tốt; Extractive local là fallback rule-based."
        : task === "flashcards"
          ? " Flashcards dùng LLM để viết thẻ gọn hơn; ảnh được lọc bằng VLM nếu có API key."
          : task === "summarize"
            ? " Tóm tắt dùng Markdown; ảnh minh họa được chọn bằng VLM nếu nội dung cần hình."
            : "";
      $("providerHint").textContent = info ? info.reason + extra : "";
    }

    function openImageModal(url, caption) {
      $("imageModalImg").src = assetUrl(url);
      $("imageModalImg").alt = caption || "Ảnh SGK";
      $("imageModalCaption").textContent = caption || "Ảnh SGK";
      $("imageModal").hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeImageModal() {
      $("imageModal").hidden = true;
      $("imageModalImg").src = "";
      document.body.style.overflow = "";
    }

    function renderSubjects() {
      const seen = new Set();
      const subjects = [];
      lessons.forEach(lesson => {
        const value = lesson.subject || lesson.subject_label;
        if (!value || seen.has(value)) return;
        seen.add(value);
        subjects.push({ value, label: lesson.subject_label || lesson.subject || value });
      });
      $("subject").innerHTML = `<option value="">Tất cả</option>` + subjects.map(subject => `<option value="${escapeHtml(subject.value)}">${escapeHtml(subject.label)}</option>`).join("");
    }

    function subjectDisplayName(value) {
      if (!value) return "Tất cả";
      const lesson = lessons.find(item => item.subject === value || item.subject_label === value);
      return lesson?.subject_label || value;
    }

    function renderLessons() {
      const subject = $("subject").value;
      const q = $("lessonSearch").value.trim().toLowerCase();
      const filtered = lessons.filter(lesson => {
        const subjectOk = !subject || lesson.subject === subject || lesson.subject_label === subject;
        const text = `${lesson.lesson_title} ${lesson.lesson_number ?? ""}`.toLowerCase();
        return subjectOk && (!q || text.includes(q));
      });
      const allActive = selectedLessonId === "";
      $("lessonList").innerHTML = `
        <button class="lesson-button ${allActive ? "active" : ""}" data-lesson="">
          <strong>Tất cả bài học</strong>
          <span>${filtered.length} phạm vi đang hiển thị</span>
        </button>
        ${filtered.map(lesson => `
          <button class="lesson-button ${lesson.lesson_id === selectedLessonId ? "active" : ""}" data-lesson="${escapeHtml(lesson.lesson_id)}">
            <strong>${escapeHtml(lesson.subject_label || lesson.subject || "SGK")} · ${escapeHtml(lesson.lesson_title)}</strong>
            <span>${escapeHtml(lesson.subject_label || lesson.subject || "SGK")} · ${lesson.chunk_count || 0} chunks</span>
          </button>
        `).join("")}
      `;
      document.querySelectorAll(".lesson-button").forEach(button => {
        button.addEventListener("click", () => {
          selectedLessonId = button.dataset.lesson || "";
          const picked = selectedLesson();
          if (picked && (picked.subject || picked.subject_label)) $("subject").value = picked.subject || picked.subject_label;
          renderLessons();
          updateTaskView();
        });
      });
      $("activeSubject").textContent = subjectDisplayName(subject);
    }

    function renderQuickSamples() {
      const config = taskConfig[task];
      $("quickGrid").innerHTML = config.samples.map(sample => `<button class="quick" data-sample="${escapeHtml(sample)}">${escapeHtml(sample)}</button>`).join("");
      document.querySelectorAll(".quick").forEach(button => {
        button.addEventListener("click", () => {
          $("query").value = button.dataset.sample || "";
          $("query").focus();
        });
      });
    }

    function taskEmptyMessage() {
      if (task === "ask") {
        return { title: "Hỏi đáp theo SGK", body: "Nhập câu hỏi để AI trả lời dựa trên 10 nguồn liên quan nhất." };
      }
      if (task === "summarize") {
        return { title: "Tóm tắt bài học", body: "Chọn bài hoặc nhập chủ đề; hệ thống tự lấy 10 nguồn liên quan nhất để tóm tắt." };
      }
      if (task === "quiz") {
        return { title: "Tạo quiz ôn tập", body: "Quiz tự lấy 5 nguồn liên quan nhất; bạn chỉ cần chọn số câu hỏi muốn tạo." };
      }
      return { title: "Tạo flashcards", body: "Flashcards tự lấy 10 nguồn liên quan nhất và tự quyết số thẻ phù hợp với nội dung." };
    }

    function resetResultPanel() {
      const message = taskEmptyMessage();
      $("resultMeta").textContent = "Sẵn sàng";
      $("resultBody").innerHTML = `
        <div class="empty-state">
          <strong>${escapeHtml(message.title)}</strong>
          <span>${escapeHtml(message.body)}</span>
        </div>
      `;
    }

    function updateTaskView() {
      const config = taskConfig[task];
      $("taskTitle").textContent = config.title;
      $("queryLabel").textContent = config.label;
      $("query").placeholder = config.placeholder;
      $("run").textContent = config.button;
      $("scopeLabel").textContent = currentScopeText();
      $("countWrap").style.display = task === "quiz" ? "block" : "none";
      $("providerWrap").style.display = "block";
      $("resultTitle").textContent = config.title;
      renderQuickSamples();
      updateProviderHint();
      resetResultPanel();
    }

    function setBusy(isBusy, label = "") {
      $("run").disabled = isBusy;
      $("globalStatus").textContent = isBusy ? label || "Đang xử lý..." : "Sẵn sàng";
      $("runStatus").textContent = label;
      $("runStatus").classList.remove("error");
      $("resultMeta").textContent = isBusy ? "Đang chạy" : "Sẵn sàng";
    }

    function showError(message) {
      $("globalStatus").textContent = "Có lỗi";
      $("runStatus").textContent = message;
      $("runStatus").classList.add("error");
      $("resultMeta").textContent = "Lỗi";
      $("resultBody").innerHTML = `<div class="error-box">${escapeHtml(message)}</div>`;
    }

    function providerBadge(provider) {
      if (!provider) return "";
      const warn = provider.includes("fallback") ? " warn" : "";
      return `<span class="badge${warn}">${escapeHtml(provider)}</span>`;
    }

    function sourceLabel(meta) {
      if (!meta) return "nguồn SGK";
      const lesson = meta.lesson_number ? `Bài ${meta.lesson_number}` : (meta.lesson_title || meta.section || "SGK");
      const page = meta.page ? `tr. ${meta.page}` : "";
      return [lesson, page].filter(Boolean).join(", ");
    }

    function sourceTitle(meta) {
      if (!meta) return "Nguồn SGK";
      return [meta.filename, meta.lesson_title || meta.section, meta.page ? `trang ${meta.page}` : ""].filter(Boolean).join(" · ");
    }

    function citationMap(citations, chunks) {
      const map = {};
      (chunks || []).forEach((chunk, index) => {
        const marker = `S${index + 1}`;
        const meta = chunk.metadata || {};
        map[marker] = {
          label: sourceLabel(meta),
          title: sourceTitle(meta),
          snippet: chunk.snippet || chunk.text || ""
        };
      });
      (citations || []).forEach(citation => {
        const marker = citation.source_marker || `S${citation.source_index}`;
        if (map[marker]) {
          map[marker].title = sourceTitle(citation) || map[marker].title;
        } else {
          map[marker] = {
            label: sourceLabel(citation),
            title: sourceTitle(citation),
            snippet: ""
          };
        }
      });
      return map;
    }

    function renderInlineMarkdown(text, citeMap = {}) {
      let html = escapeHtml(text);
      const codeSpans = [];
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${codeSpans.length}@@`;
        codeSpans.push(`<code>${code}</code>`);
        return token;
      });
      html = html.replace(/\[(S\d+)\]/g, (_, marker) => {
        const source = citeMap[marker] || { label: marker, title: marker };
        return `<sup class="cite-chip" title="${escapeHtml(source.title)}">${escapeHtml(source.label)}</sup>`;
      });
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      html = html.replace(/@@CODE(\d+)@@/g, (_, index) => codeSpans[Number(index)] || "");
      return html;
    }

    function renderMarkdownTable(lines, citeMap) {
      const rows = lines.map(line => line.trim().replace(/^\||\|$/g, "").split("|").map(cell => renderInlineMarkdown(cell.trim(), citeMap)));
      const head = rows[0] || [];
      const body = rows.slice(2);
      return `<table class="markdown-table"><thead><tr>${head.map(cell => `<th>${cell}</th>`).join("")}</tr></thead><tbody>${body.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    function renderMarkdown(markdown, citations = [], chunks = []) {
      const citeMap = citationMap(citations, chunks);
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let paragraph = [];
      let listType = null;
      let listItems = [];
      let table = [];

      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" ").trim(), citeMap)}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!listType) return;
        html.push(`<${listType}>${listItems.map(item => `<li>${renderInlineMarkdown(item, citeMap)}</li>`).join("")}</${listType}>`);
        listType = null;
        listItems = [];
      };
      const flushTable = () => {
        if (table.length) html.push(renderMarkdownTable(table, citeMap));
        table = [];
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          flushTable();
          flushParagraph();
          flushList();
          continue;
        }
        if (line.includes("|") && /^\|?[^|]+\|/.test(line)) {
          flushParagraph();
          flushList();
          table.push(line);
          continue;
        }
        flushTable();
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2], citeMap)}</h${level}>`);
          continue;
        }
        const bullet = line.match(/^[-*]\s+(.+)$/);
        const numbered = line.match(/^\d+\.\s+(.+)$/);
        if (bullet || numbered) {
          flushParagraph();
          const nextType = bullet ? "ul" : "ol";
          if (listType && listType !== nextType) flushList();
          listType = nextType;
          listItems.push((bullet || numbered)[1]);
          continue;
        }
        flushList();
        paragraph.push(line);
      }
      flushTable();
      flushParagraph();
      flushList();
      return `<div class="markdown-body">${html.join("") || `<p>${escapeHtml(markdown || "")}</p>`}</div>`;
    }

    function renderReferences(citations, chunks) {
      const citeMap = citationMap(citations, chunks);
      const markers = Object.keys(citeMap);
      if (!markers.length) return "";
      return `
        <div class="reference-list">
          <h3>Nguồn tham khảo</h3>
          ${markers.map(marker => {
            const source = citeMap[marker];
            return `
              <details class="reference-item">
                <summary>${escapeHtml(source.label)} <span class="subtle">${escapeHtml(marker)}</span></summary>
                ${source.title ? `<p>${escapeHtml(source.title)}</p>` : ""}
                ${source.snippet ? `<p>${escapeHtml(source.snippet)}</p>` : ""}
              </details>
            `;
          }).join("")}
        </div>
      `;
    }

    function typesetMath() {
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise().catch(() => {});
      }
    }

    function chunksByMarker(chunks) {
      return Object.fromEntries((chunks || []).map((chunk, index) => [`S${index + 1}`, chunk]));
    }

    function itemSourceChunks(item, chunks, markerMap) {
      const markers = (item.source_markers || []).filter(marker => markerMap[marker]);
      const selected = markers.map(marker => markerMap[marker]);
      return selected.length ? selected : (chunks || []).slice(0, 1);
    }

    function figureCaptionsFromText(text) {
      const clean = String(text || "").replace(/\s+/g, " ");
      const matches = [...clean.matchAll(/Hình\s+\d+(?:[.,]\d+)?\s*\.?\s*[^.!?]{0,120}/gi)]
        .map(match => match[0].replace(/\s+/g, " ").trim())
        .filter(Boolean);
      return [...new Set(matches)];
    }

    function renderImageTileList(images, limit = 4) {
      const visible = (images || []).filter(image => image.url).slice(0, limit);
      if (!visible.length) return "";
      return `<div class="quiz-images">${visible.map(image => {
        const figure = image.figure ? `Hình ${image.figure} · ` : "";
        const match = image.match_type === "nearby_figure" ? " · lân cận" : "";
        const captionText = image.derivedCaption || image.caption || image.label || "Ảnh SGK";
        const caption = `Trang ${image.page || image.page_number || "?"} · ${figure}${captionText}${match}`;
        return `
          <button class="quiz-image" type="button" data-image-url="${escapeHtml(image.url)}" data-image-caption="${escapeHtml(caption)}">
            <img src="${escapeHtml(assetUrl(image.url))}" alt="${escapeHtml(captionText)}" loading="lazy" onerror="this.onerror=null;this.src=this.src.split('&retry=')[0]+'&retry='+Date.now()">
            <span>${escapeHtml(caption)}</span>
          </button>
        `;
      }).join("")}</div>`;
    }

    function renderVisualBlock(images, title = "Ảnh minh họa", limit = 4, className = "summary-visuals") {
      const tiles = renderImageTileList(images, limit);
      if (!tiles) return "";
      return `
        <div class="${escapeHtml(className)}">
          <h3>${escapeHtml(title)}</h3>
          ${tiles}
        </div>
      `;
    }

    function renderImageTiles(chunks, limit = 4) {
      const images = [];
      for (const chunk of chunks || []) {
        const captions = figureCaptionsFromText(`${chunk.text || ""} ${chunk.snippet || ""}`);
        for (const [imageIndex, image] of (chunk.images || []).entries()) {
          if (image.url && !images.some(item => item.url === image.url)) {
            images.push({
              ...image,
              derivedCaption: image.caption || captions[Math.min(imageIndex, Math.max(0, captions.length - 1))],
              page: (chunk.metadata || {}).page
            });
          }
          if (images.length >= limit) break;
        }
        if (images.length >= limit) break;
      }
      return renderImageTileList(images, limit);
    }

    function itemNeedsVisibleImages(item) {
      const text = `${item.question || ""} ${item.explanation || ""} ${item.image_hint || ""}`.toLowerCase();
      const images = (item.evidence && item.evidence.images) || item.images || [];
      return images.some(image => image.url) || /hình\s+\d|quan sát|bản đồ|địa hình|đường đồng mức|thang màu|lược đồ|sơ đồ|bảng\s+\d|biểu đồ|kí hiệu|chú giải|tỉ lệ|tỷ lệ|khoảng cách|phương hướng/.test(text);
    }

    function renderQuizMedia(item, chunks, markerMap) {
      if (!itemNeedsVisibleImages(item)) return "";
      const imageTiles = renderImageTileList((item.evidence && item.evidence.images) || item.images, 4);
      if (!imageTiles) return "";
      return `
        <div class="quiz-media">
          <div class="quiz-evidence-head">
            <span>Hình SGK liên quan</span>
          </div>
          ${imageTiles}
        </div>
      `;
    }

    function renderQuizEvidence(item, chunks, markerMap) {
      const sourceChunks = itemSourceChunks(item, chunks, markerMap);
      const evidence = item.evidence || {};
      const sourceRecords = evidence.sources || [];
      const fallbackSources = sourceChunks.map((chunk, index) => {
        const marker = (item.source_markers || [])[index] || `S${(chunks || []).indexOf(chunk) + 1}`;
        const meta = chunk.metadata || {};
        return { marker, page: meta.page, lesson_title: meta.lesson_title || meta.section };
      });
      const pageChips = (sourceRecords.length ? sourceRecords : fallbackSources)
        .map(source => `<span class="source-chip">${escapeHtml(source.marker || "")} · trang ${escapeHtml(source.page ?? "")}</span>`)
        .join("");
      const first = sourceChunks[0] || {};
      const meta = first.metadata || {};
      const evidenceText = evidence.text || item.explanation || first.snippet || first.text || "";
      const evidenceTitle = evidence.title || meta.lesson_title || meta.section || "SGK";
      const evidenceImages = renderImageTileList(evidence.images || item.images, 4);
      return `
        <div class="quiz-evidence">
          <div class="quiz-evidence-head">
            <span>Dẫn chứng</span>
            <span class="quiz-evidence-pages">${pageChips}</span>
          </div>
          <div class="evidence-title">${escapeHtml(evidenceTitle)}</div>
          <div class="evidence-text">${renderMarkdown(evidenceText, [], chunks)}</div>
          ${evidenceImages}
        </div>
      `;
    }

    function renderSources(chunks) {
      if (!chunks || !chunks.length) return "";
      return `
        <div class="panel-head" style="padding:0 0 10px;border:0">
          <h2>Nguồn trích dẫn</h2>
          <span class="subtle">${chunks.length} chunks</span>
        </div>
        ${chunks.slice(0, 8).map((chunk, index) => {
          const meta = chunk.metadata || {};
          const images = (chunk.images || []).filter(image => image.url).slice(0, 4)
            .map(image => {
              const caption = `${meta.page ? "Trang " + meta.page + " · " : ""}${image.caption || "Ảnh SGK"}`;
              return `<button type="button" data-image-url="${escapeHtml(image.url)}" data-image-caption="${escapeHtml(caption)}"><img src="${escapeHtml(assetUrl(image.url))}" title="${escapeHtml(caption)}" alt="${escapeHtml(caption)}" loading="lazy" onerror="this.onerror=null;this.src=this.src.split('&retry=')[0]+'&retry='+Date.now()"></button>`;
            }).join("");
          return `<div class="source-card">
            <div>
              <strong>S${index + 1} · Trang ${meta.page ?? ""} · ${escapeHtml(meta.lesson_title || meta.section || "Không rõ bài")}</strong>
              <p>${escapeHtml(chunk.snippet || chunk.text || "")}</p>
            </div>
            <div class="thumbs">${images}</div>
          </div>`;
        }).join("")}
      `;
    }

    function renderAnswer(data) {
      $("resultMeta").textContent = `${(data.chunks || []).length} nguồn`;
      $("resultBody").innerHTML = `
        <div class="answer-card">
          <div class="badge-row">${providerBadge(data.provider)}${data.model ? `<span class="badge coral">${escapeHtml(data.model)}</span>` : ""}</div>
          <div class="answer-text">${renderMarkdown(data.answer || "Không có câu trả lời.", data.citations, data.chunks)}</div>
        </div>
        ${renderReferences(data.citations, data.chunks)}
      `;
      typesetMath();
    }

    function renderSummary(data) {
      $("resultMeta").textContent = `${(data.key_points || []).length} ý chính`;
      $("resultBody").innerHTML = `
        <div class="summary-card">
          <div class="badge-row">${providerBadge(data.provider)}${data.model ? `<span class="badge coral">${escapeHtml(data.model)}</span>` : ""}</div>
          <div class="answer-text">${renderMarkdown(data.summary || "Không có tóm tắt.", data.citations, data.chunks)}</div>
          ${(data.key_points || []).length ? `<div class="answer-text"><h3>Ý chính cần nhớ</h3><ul>${data.key_points.map(point => `<li>${renderInlineMarkdown(point, citationMap(data.citations, data.chunks))}</li>`).join("")}</ul></div>` : ""}
          ${renderVisualBlock(data.visuals || [], "Ảnh minh họa phù hợp", 4, "summary-visuals")}
        </div>
        ${renderReferences(data.citations, data.chunks)}
      `;
      typesetMath();
    }

    function renderQuiz(data) {
      $("resultMeta").textContent = `${(data.items || []).length} câu hỏi`;
      const markerMap = chunksByMarker(data.chunks);
      const quizCiteMap = citationMap(data.citations, data.chunks);
      $("resultBody").innerHTML = `
        <div class="badge-row">${providerBadge(data.provider)}${data.model ? `<span class="badge coral">${escapeHtml(data.model)}</span>` : ""}</div>
        ${(data.items || []).map((item, itemIndex) => `
          <div class="quiz-card" data-correct="${item.correct_index}">
            <h3>Câu ${itemIndex + 1}. ${renderInlineMarkdown(item.question, quizCiteMap)}</h3>
            ${renderQuizMedia(item, data.chunks, markerMap)}
            <div class="options">
              ${(item.options || []).map((option, optionIndex) => `
                <button class="option" data-option="${optionIndex}">
                  <strong>${letters[optionIndex]}.</strong> ${renderInlineMarkdown(option, quizCiteMap)}
                </button>
              `).join("")}
            </div>
            ${renderQuizEvidence(item, data.chunks, markerMap)}
            <div class="explain">${renderInlineMarkdown(item.explanation || "", quizCiteMap)}</div>
          </div>
        `).join("") || `<div class="empty-state"><strong>Chưa tạo được câu hỏi.</strong><span>Hãy chọn một bài học cụ thể hoặc nhập chủ đề rõ hơn.</span></div>`}
      `;
      typesetMath();
      document.querySelectorAll(".quiz-card").forEach(card => {
        card.querySelectorAll(".option").forEach(option => {
          option.addEventListener("click", () => {
            const correct = Number(card.dataset.correct);
            card.classList.add("answered");
            card.querySelectorAll(".option").forEach(button => {
              const value = Number(button.dataset.option);
              button.classList.toggle("correct", value === correct);
              button.classList.toggle("wrong", button === option && value !== correct);
            });
          });
        });
      });
    }

    function renderFlashcards(data) {
      const cards = data.cards || [];
      $("resultMeta").textContent = `${cards.length} thẻ`;
      if (!cards.length) {
        $("resultBody").innerHTML = `<div class="empty-state"><strong>Chưa tạo được flashcards.</strong><span>Hãy chọn một bài học cụ thể hoặc nhập chủ đề rõ hơn.</span></div>`;
        return;
      }
      const citeMap = citationMap(data.citations, data.chunks);
      $("resultBody").innerHTML = `
        <div class="badge-row">${providerBadge(data.provider)}${data.model ? `<span class="badge coral">${escapeHtml(data.model)}</span>` : ""}</div>
        <div class="study-deck" data-active="0">
          <div class="study-deck-head">
            <span class="study-progress" data-study-progress>Thẻ 1 / ${cards.length}</span>
            <span class="subtle">Bấm vào thẻ hoặc nhấn Space/Enter để lật.</span>
          </div>
          <div class="study-stage">
            ${cards.map((card, index) => {
              const images = (card.images || card.evidence?.images || []).filter(image => image.url);
              const evidenceText = card.evidence?.text || card.evidence_text || "";
              return `
                <div class="study-card ${index === 0 ? "active" : ""}" data-card-index="${index}" role="button" tabindex="${index === 0 ? "0" : "-1"}" aria-label="Flashcard ${index + 1}">
                  <div class="study-card-inner">
                    <section class="study-face study-front">
                      <div class="study-front-text">${renderMarkdown(card.front || "", data.citations, data.chunks)}</div>
                      <span class="study-action">Nhấn để xem mặt sau</span>
                    </section>
                    <section class="study-face study-back">
                      <div class="study-back-text">${renderMarkdown(card.back || "", data.citations, data.chunks)}</div>
                      ${card.hint ? `<div class="study-hint"><strong>Gợi ý:</strong> ${renderInlineMarkdown(card.hint, citeMap)}</div>` : ""}
                      ${renderVisualBlock(images, "Ảnh gợi nhớ", 2, "study-visuals")}
                      ${evidenceText ? `<div class="study-evidence">${renderMarkdown(evidenceText, data.citations, data.chunks)}</div>` : ""}
                      <span class="study-action">Nhấn để quay lại mặt trước</span>
                    </section>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="study-controls">
            <button type="button" data-study-prev>Thẻ trước</button>
            <button type="button" data-study-flip>Lật thẻ</button>
            <button type="button" data-study-next>Thẻ sau</button>
          </div>
        </div>
      `;
      const deck = $("resultBody").querySelector(".study-deck");
      const setActive = nextIndex => {
        const active = Math.max(0, Math.min(cards.length - 1, nextIndex));
        deck.dataset.active = String(active);
        deck.querySelector("[data-study-progress]").textContent = `Thẻ ${active + 1} / ${cards.length}`;
        deck.querySelectorAll(".study-card").forEach(card => {
          const isActive = Number(card.dataset.cardIndex) === active;
          card.classList.toggle("active", isActive);
          card.classList.remove("flipped");
          card.tabIndex = isActive ? 0 : -1;
          if (isActive) card.focus({ preventScroll: true });
        });
        deck.querySelector("[data-study-prev]").disabled = active === 0;
        deck.querySelector("[data-study-next]").disabled = active === cards.length - 1;
      };
      const flipActive = () => {
        const activeCard = deck.querySelector(".study-card.active");
        if (activeCard) activeCard.classList.toggle("flipped");
      };
      deck.querySelectorAll(".study-card").forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest("[data-image-url]")) return;
          flipActive();
        });
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            flipActive();
          }
        });
      });
      deck.querySelector("[data-study-prev]").addEventListener("click", () => setActive(Number(deck.dataset.active || 0) - 1));
      deck.querySelector("[data-study-next]").addEventListener("click", () => setActive(Number(deck.dataset.active || 0) + 1));
      deck.querySelector("[data-study-flip]").addEventListener("click", flipActive);
      setActive(0);
      typesetMath();
    }

    function renderSearch(data) {
      $("resultMeta").textContent = `${(data.results || []).length} kết quả`;
      $("resultBody").innerHTML = renderSources(data.results) || `<div class="empty-state"><strong>Không tìm thấy nguồn phù hợp.</strong></div>`;
    }

    async function runTask() {
      const config = taskConfig[task];
      const query = $("query").value.trim();
      const selectedProvider = $("provider").value;
      const providerInfo = providerStatus[selectedProvider];
      const topK = AUTO_TOP_K[task] || 10;
      const effectiveQuery = query || AUTO_QUERY[task] || config.samples[0];
      if (["summarize", "quiz", "flashcards"].includes(task) && !query && !selectedLessonId) {
        showError("Hãy chọn một bài ở cột Nguồn SGK hoặc nhập chủ đề trước khi chạy tác vụ này.");
        return;
      }
      if (providerInfo && !providerInfo.available) {
        showError(providerInfo.reason || "Provider chưa sẵn sàng.");
        return;
      }

      setBusy(true, `${config.button}...`);
      $("resultBody").innerHTML = `<div class="empty-state"><strong>${escapeHtml(config.button)}...</strong><span>${escapeHtml(currentScopeText())} · Top K tự động: ${topK}</span></div>`;
      const filters = filtersPayload();
      let endpoint = `/${task}`;
      let body;
      if (task === "ask") {
        body = { query: query || config.samples[0], top_k: topK, provider: selectedProvider, filters };
      } else if (task === "summarize") {
        body = { query: effectiveQuery, top_k: topK, provider: selectedProvider, filters };
      } else if (task === "quiz") {
        body = { query: effectiveQuery, top_k: topK, count: Number($("count").value), provider: selectedProvider, filters };
      } else {
        body = { query: effectiveQuery, top_k: topK, count: null, provider: selectedProvider, filters };
      }

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const contentType = response.headers.get("content-type") || "";
        const data = contentType.includes("application/json") ? await response.json() : { detail: await response.text() };
        if (!response.ok) throw new Error(data.detail || data.message || JSON.stringify(data));
        $("globalStatus").textContent = "Hoàn tất";
        $("runStatus").textContent = `Hoàn tất · ${currentScopeText()}`;
        $("resultMeta").textContent = "Hoàn tất";
        if (task === "ask") renderAnswer(data);
        else if (task === "summarize") renderSummary(data);
        else if (task === "quiz") renderQuiz(data);
        else renderFlashcards(data);
      } catch (error) {
        showError(error.message || String(error));
      } finally {
        $("run").disabled = false;
      }
    }

    async function loadMeta() {
      const [docsRes, lessonsRes, providersRes] = await Promise.all([
        fetch("/documents"),
        fetch("/lessons"),
        fetch("/providers")
      ]);
      docs = await docsRes.json();
      lessons = await lessonsRes.json();
      renderProviders(await providersRes.json());
      renderMetrics();
      renderSubjects();
      renderLessons();
      updateTaskView();
      $("query").value = "Kinh độ, vĩ độ là gì?";
      $("globalStatus").textContent = "Sẵn sàng";
      $("resultMeta").textContent = "Sẵn sàng";
    }

    document.querySelectorAll(".mode-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".mode-tabs button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        task = button.dataset.task;
        updateTaskView();
      });
    });

    $("subject").addEventListener("change", () => {
      selectedLessonId = "";
      renderLessons();
      updateTaskView();
    });
    $("lessonSearch").addEventListener("input", renderLessons);
    $("provider").addEventListener("change", updateProviderHint);
    $("run").addEventListener("click", runTask);
    $("resultBody").addEventListener("click", event => {
      const trigger = event.target.closest("[data-image-url]");
      if (!trigger) return;
      event.preventDefault();
      openImageModal(trigger.dataset.imageUrl, trigger.dataset.imageCaption || "");
    });
    document.querySelectorAll("[data-modal-close]").forEach(button => button.addEventListener("click", closeImageModal));
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !$("imageModal").hidden) closeImageModal();
    });

    loadMeta().catch(error => showError(error.message || String(error)));
  </script>
</body>
</html>
